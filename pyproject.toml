[project]
name = "darkfactory"
version = "0.1.0"
description = "Self-hosted, project-isolated software delivery factory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "docker>=7.1,<8", "httpx>=0.28,<1",
  "cryptography>=50.0.0,<51", "python-multipart>=0.0.20,<1",
]

[project.scripts]
darkfactory = "darkfactory.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
darkfactory = ["static/*"]
